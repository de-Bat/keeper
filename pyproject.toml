[project]
name = "keeper"
version = "0.1.0"
description = "Save screenshots of recommendations; Keeper identifies the source, enriches it with metadata, and makes it searchable."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "rapidocr_onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
