# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Magpie
options:
  bundleIdPrefix: com.example.magpie   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""               # set your Apple team id
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Magpie:
    type: application
    platform: iOS
    sources: [Magpie, Shared]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Magpie/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Magpie saves the screenshots you pick so it can identify and catalogue them.
        NSLocalNetworkUsageDescription: Magpie connects to your self-hosted Magpie server on your network.
        # Self-hosted servers are often plain http on a LAN / Tailscale address.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).sync]
    entitlements:
      path: Magpie/Magpie.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.magpie]
    dependencies:
      - target: MagpieShare
  MagpieShare:
    type: app-extension
    platform: iOS
    sources: [MagpieShare, Shared]
    info:
      path: MagpieShare/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: MagpieShare/MagpieShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.magpie]
