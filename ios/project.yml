# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Keeper
options:
  bundleIdPrefix: com.example.keeper   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""               # set your Apple team id
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Keeper:
    type: application
    platform: iOS
    sources: [Keeper, Shared]
    info:
      path: Keeper/Info.plist
      properties:
        CFBundleDisplayName: Keeper
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Keeper saves the screenshots you pick so it can identify and catalogue them.
        NSLocalNetworkUsageDescription: Keeper connects to your self-hosted Keeper server on your network.
        # Self-hosted servers are often plain http on a LAN / Tailscale address.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).sync]
    entitlements:
      path: Keeper/Keeper.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.keeper]
    dependencies:
      - target: KeeperShare
  KeeperShare:
    type: app-extension
    platform: iOS
    sources: [KeeperShare, Shared]
    info:
      path: KeeperShare/Info.plist
      properties:
        CFBundleDisplayName: Keeper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: KeeperShare/KeeperShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.keeper]
